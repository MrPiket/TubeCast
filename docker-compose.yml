services:
  app:
    build: .
    # yt-dlp spawns ffmpeg; when yt-dlp dies first, ffmpeg is reparented to
    # PID 1. Node does not reap orphans, so without an init they pile up as
    # zombies. Docker's init (tini) reaps them.
    init: true
    ports:
      - "5151:5151"
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - PORT=5151
      - FEED_BASE_URL=http://localhost:5151
